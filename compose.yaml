services:
  postgres:
    image: postgres:17
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: change_me_local
      POSTGRES_DB: hotel_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
  
volumes:
  postgres_data: